<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SouthBay ClearRide – Admin Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px; background: #f3f4f6; color: #111827; }
    h1 { text-align: center; color: #1e3a8a; }
    .card { background: white; border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    label { font-weight: bold; display: block; margin-top: 10px; }
    input, textarea { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-family: Arial, sans-serif; }
    textarea { min-height: 70px; resize: vertical; }
    .btn { background: #10b981; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 12px; font-weight: bold; }
    .btn:hover { background: #059669; }
    .status { margin-top: 12px; padding: 8px; border-radius: 8px; text-align: center; font-weight: bold; }
    .success { background: #d1fae5; color: #065f46; }
    #login { max-width: 350px; margin: 80px auto; }
  </style>
</head>
<body>

<div id="login">
  <h1>🔐 Admin Login</h1>
  <input type="password" id="pwd" placeholder="Password" />
  <button class="btn" onclick="login()" style="width:100%;">Enter</button>
  <p style="text-align:center; color:maroon; font-weight:bold;" id="loginError"></p>
</div>

<div id="dashboard" style="display:none;">
  <h1>⚙️ SouthBay ClearRide – Admin</h1>

  <div class="card">
    <h2>📝 Page Content (English Defaults)</h2>
    <label>Subtitle</label>
    <input type="text" id="subtitle" />

    <label>What This Is</label>
    <textarea id="what"></textarea>

    <label>Insurance Awareness</label>
    <textarea id="insurance"></textarea>

    <label>Why This Exists</label>
    <textarea id="why"></textarea>
  </div>

  <div class="card">
    <h2>📱 QR Target URL</h2>
    <label>QR Code points to:</label>
    <input type="url" id="qrTarget" placeholder="https://your-site.com/index.html" />
    <p style="font-size: 12px; color: #6b7280;">Update this to change where the homepage QR code redirects scans.</p>
  </div>

  <div class="card">
    <h2>📢 Announcement Banner (Optional)</h2>
    <textarea id="announcement" placeholder="e.g. New helmet enforcement law starts this weekend!"></textarea>
  </div>

  <button class="btn" onclick="save()">💾 Save Changes</button>
  <div id="status" class="status" style="display:none;"></div>
  <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ccc;"/>
  <button class="btn" style="background:#ef4444; margin-top:0;" onclick="resetDefaults()">Reset to Defaults</button>
</div>

<script>
  const ADMIN_PASSWORD = "clearride2025"; 
  const storageKey = 'southbayClearRideData';
  
  const fields = ['subtitle', 'what', 'insurance', 'why', 'qrTarget', 'announcement'];
  const defaults = {
    subtitle: 'Micro‑Mobility Info for South Bay San Diego',
    what: 'A simple safety, insurance, and local riding guide for electric bikes, scooters, and other micro‑mobility devices in the South Bay area (Chula Vista, National City, Imperial Beach, San Ysidro).',
    insurance: 'Coverage varies. Check your policy for e‑bikes/scooters. Many California homeowners policies have exclusions. Ask your agent about liability.',
    why: 'Micro‑mobility is growing fast in South Bay, but clear safety and insurance info often doesn’t reach riders. This hub fills the gap.',
    qrTarget: 'https://your-site.com/index.html',
    announcement: ''
  };

  function login() {
    if (document.getElementById('pwd').value === ADMIN_PASSWORD) {
      document.getElementById('login').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadData();
    } else {
      document.getElementById('loginError').textContent = 'Wrong password.';
    }
  }

  function loadData() {
    const data = JSON.parse(localStorage.getItem(storageKey)) || defaults;
    fields.forEach(f => document.getElementById(f).value = data[f] ?? '');
  }

  function save() {
    const data = {};
    fields.forEach(f => data[f] = document.getElementById(f).value);
    data.lastUpdated = new Date().toISOString();
    
    localStorage.setItem(storageKey, JSON.stringify(data));
    showStatus('✅ Changes saved! Your public page is updated.');
  }

  function resetDefaults() {
    if (confirm('Reset all content to original defaults?')) {
      localStorage.removeItem(storageKey);
      loadData();
      showStatus('🔄 Defaults restored.');
    }
  }

  function showStatus(msg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = 'status success';
    el.style.display = 'block';
    setTimeout(() => el.style.display = 'none', 4000);
  }
</script>
</body>
</html>
